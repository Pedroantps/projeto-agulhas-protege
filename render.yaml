# Blueprint do Render: um único serviço web (API + frontend). O banco PostgreSQL é externo
# (Neon, Supabase ou Render Postgres): informe a connection string em DATABASE_URL.
services:
  - type: web
    name: agulhas-protege
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COLETA_HABILITADA
        value: "true"
      - key: COLETA_INTERVALO_MINUTOS
        value: "10"
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://agulhas-protege.onrender.com"]'
      - key: LOG_FORMAT
        value: json
