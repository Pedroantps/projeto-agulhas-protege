name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — Lint, Type-Check & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agulhas_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python Dependencies
        run: uv sync
        working-directory: backend

      - name: Linting with Ruff
        run: uv run ruff check .
        working-directory: backend

      - name: Formatting check with Ruff
        run: uv run ruff format --check .
        working-directory: backend

      - name: Static Type Checking with Mypy
        run: uv run mypy app/
        working-directory: backend

      - name: Run Tests with Coverage (>80%)
        run: uv run pytest --cov=app --cov-fail-under=80
        working-directory: backend

  frontend:
    name: Frontend — Lint, Type-Check, Coverage & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint Code Quality
        run: npm run lint
        working-directory: frontend

      - name: TypeScript Type Checking
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Unit, Component & Accessibility Tests with Coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: frontend

      - name: Playwright E2E Tests
        run: npx playwright test
        working-directory: frontend
